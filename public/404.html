<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiscoZero — Página não encontrada</title>
  <!-- As fontes vêm do próprio projeto (public/fonts), não de CDN: se a rede
       da escola bloquear fontes externas, a identidade visual não muda. -->
  <meta name="description" content="O endereço digitado não existe no RiscoZero.">

  <!-- Cartão de link (WhatsApp, Telegram, redes). Sem isto, o endereço
       compartilhado na Mostra aparece como URL crua, sem dizer o que é.
       og:image fica relativo de propósito: o endereço público só existe
       depois de publicar, e a maioria dos leitores resolve o caminho
       relativo contra a própria página. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RiscoZero">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="RiscoZero — Página não encontrada">
  <meta property="og:description" content="O endereço digitado não existe no RiscoZero.">
  <meta property="og:image" content="icone-512.png">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#14110E">
  <link rel="preload" href="fonts/manrope-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Primeiro elemento focável da página: quem navega por teclado ou leitor
       de tela pula o cabeçalho e a navegação (repetidos em toda tela) e cai
       direto no conteúdo. Fica invisível até receber foco. -->
  <a class="pular-conteudo" href="#conteudo-principal">Pular para o conteúdo</a>
  <header class="topo">
    <a href="index.html" class="marca">Risco<span>Zero</span></a>
    <nav>
      <a href="index.html">Formulário</a>
      <a href="login.html">Painel de gestão</a>
    </nav>
  </header>

  <main id="conteudo-principal" class="estreito">
    <div class="vazio">
      <div class="titulo-vazio">Página não encontrada</div>
      <p>
        O endereço digitado não existe no RiscoZero. Confira se está certo, ou
        volte para um dos caminhos abaixo.
      </p>
      <a href="index.html" class="botao">Ir para o formulário</a>
    </div>
  </main>

  <footer class="rodape">
    RiscoZero — Mostra Técnica 2026 · CEEP-PG · Equipe 1
  </footer>

  <script src="js/transicoes.js"></script>
</body>
</html>
